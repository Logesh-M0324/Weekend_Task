<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Electricity Forecasting{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f5f7fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .metric-card {
            padding: 20px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            Electricity Demand Forecasting
        </a>

        <div>
            <a href="/" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="/forecast" class="btn btn-outline-light btn-sm">
                Forecast
            </a>

            <a href="/analytics" class="btn btn-outline-light btn-sm">
                Analytics
            </a>

            <a href="{{ url_for('validation') }}" class="btn btn-outline-light btn-sm">
                Validation
            </a>
        </div>

    </div>
</nav>


<div class="container py-4">

    {% block content %}
    {% endblock %}

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>

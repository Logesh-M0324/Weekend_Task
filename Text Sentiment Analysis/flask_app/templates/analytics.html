{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Text Analytics
</h2>


<div class="row g-4">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h5>
                    Sentiment Distribution
                </h5>

                <p>
                    Positive:
                    {{ sentiment_counts.get("positive", 0) }}
                </p>

                <p>
                    Negative:
                    {{ sentiment_counts.get("negative", 0) }}
                </p>

            </div>

        </div>

    </div>


    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h5>
                    Average Review Length
                </h5>

                <h3>
                    {{ average_length }}
                    words
                </h3>

            </div>

        </div>

    </div>

</div>


<hr class="my-5">


<h4>
    EDA Visualizations
</h4>


<div class="row g-4 mt-2">

    <div class="col-md-6">

        <img
            src="{{ url_for(
                'static',
                filename='plots/sentiment_distribution.png'
            ) }}"
            class="img-fluid"
            alt="Sentiment Distribution"
        >

    </div>


    <div class="col-md-6">

        <img
            src="{{ url_for(
                'static',
                filename='plots/review_length_distribution.png'
            ) }}"
            class="img-fluid"
            alt="Review Length Distribution"
        >

    </div>


    <div class="col-md-6">

        <img
            src="{{ url_for(
                'static',
                filename='plots/word_frequency.png'
            ) }}"
            class="img-fluid"
            alt="Word Frequency"
        >

    </div>


    <div class="col-md-6">

        <img
            src="{{ url_for(
                'static',
                filename='plots/wordcloud.png'
            ) }}"
            class="img-fluid"
            alt="Word Cloud"
        >

    </div>

</div>

{% endblock %}

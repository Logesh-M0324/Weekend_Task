{% extends "base.html" %}

{% block content %}

<h2>Upload Skin Image</h2>

<!-- Flash Messages -->

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

<form
    action="{{ url_for('upload') }}"
    method="POST"
    enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">

            Select Image

        </label>

        <input
            class="form-control"
            type="file"
            name="image"
            accept=".jpg,.jpeg,.png">

    </div>

    <button
        class="btn btn-success"
        type="submit">

        Upload

    </button>

</form>

{% endblock %}

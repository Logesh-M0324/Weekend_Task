{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i
                        class="bi bi-cloud-arrow-up-fill upload-icon">
                    </i>

                    <h2 class="mt-3">

                        Upload Skin Image

                    </h2>

                    <p class="text-muted">

                        Upload a JPG, JPEG or PNG image for disease classification.

                    </p>

                </div>

                <form
                    action="{{ url_for('upload') }}"
                    method="POST"
                    enctype="multipart/form-data"
                    id="uploadForm">

                    <!-- Upload Box -->

                    <div
                        class="upload-box"
                        onclick="document.getElementById('image').click()">

                        <input
                            type="file"
                            name="image"
                            id="image"
                            accept=".jpg,.jpeg,.png"
                            hidden>

                        <i class="bi bi-image upload-preview-icon"></i>

                        <h4>

                            Click to Browse Image

                        </h4>

                        <p>

                            or drag and drop your image here

                        </p>

                        <small class="text-muted">

                            Supported: JPG, JPEG, PNG

                        </small>

                    </div>

                    <!-- Preview -->

                    <div
                        class="text-center mt-4">

                        <img
                            id="previewImage"
                            class="img-fluid rounded shadow"
                            style="display:none; max-height:350px;">

                    </div>

                    <!-- File Name -->

                    <div
                        class="text-center mt-3">

                        <span
                            id="fileName"
                            class="fw-semibold">

                        </span>

                    </div>

                    <!-- Button -->

                    <div class="text-center mt-4">

                        <button
                            class="btn btn-primary btn-lg"
                            type="submit">

                            <i class="bi bi-search"></i>

                            Analyze Image

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Loading Overlay -->

<div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="text-center">

        <div
            class="spinner-border text-light"
            role="status">

        </div>

        <h3 class="text-white mt-4">

            Analyzing Image...

        </h3>

        <p class="text-white">

            Running Deep Learning Model

        </p>

    </div>

</div>

<script>

const imageInput = document.getElementById("image");

const previewImage = document.getElementById("previewImage");

const fileName = document.getElementById("fileName");

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){

        return;

    }

    fileName.innerHTML = file.name;

    const reader = new FileReader();

    reader.onload = function(e){

        previewImage.src = e.target.result;

        previewImage.style.display = "block";

    }

    reader.readAsDataURL(file); 

});

document.getElementById("uploadForm").addEventListener("submit", function(){

    document.getElementById("loadingOverlay").style.display = "flex";

});

</script>

{% endblock %}
